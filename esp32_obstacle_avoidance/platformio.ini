; =============================================================================
;  PlatformIO project for the ESP32 obstacle-avoidance module.
;
;  Build/upload:   pio run -t upload
;  Serial monitor: pio device monitor        (115200 baud)
;
;  src_dir = . lets PlatformIO compile the flat sketch folder (the .ino and the
;  .cpp/.h modules living next to it), so the SAME folder also opens directly in
;  the Arduino IDE. See README.md for the Arduino IDE route.
; =============================================================================

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Pinned 2026-08-03: laptop enumerates the CP2102 here (crw root:dialout).
; If the node ever moves (another USB-serial plugged first), update or drop
; these two lines and let auto-detect try.
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Silence a harmless warning from MAVLink's packed structs on Xtensa.
build_flags =
    -Wno-address-of-packed-member

lib_deps =
    okalachev/MAVLink          ; official MAVLink v2 C library (common dialect)
    pololu/VL53L0X             ; VL53L0X driver (not compiled when USE_FAKE_SENSORS=1)
