<path d="M 629 390 V 545 H 611 V 700" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="626" y="545" font-size="9.5" fill="#1f6feb" text-anchor="middle">USB, MAVLink2</text>
<path d="M 611 805 V 852 H 558 V 900" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<text x="590" y="852" font-size="9.5" fill="#1f6feb" text-anchor="middle">USB</text>
<path d="M 558 960 V 972 H 567 V 985" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
<rect x="40" y="90" width="181" height="60" rx="5" fill="#fff" stroke="#c0392b" stroke-width="1.6"/>
<text x="54" y="109" font-size="13" font-weight="600" fill="#111">3S 8000 mAh LiPo</text>
<text x="54" y="125" font-size="10.5" fill="#444">11.1 V nom, XT60</text>
<text x="54" y="140" font-size="10.5" fill="#444">measured ~63 mohm internal</text>
<rect x="40" y="200" width="205" height="45" rx="5" fill="#fff" stroke="#c0392b" stroke-width="1.6"/>
<text x="54" y="219" font-size="13" font-weight="600" fill="#111">F550 PDB / XT60 harness</text>
<text x="54" y="235" font-size="10.5" fill="#444">one pack feeds all three rails</text>
<rect x="40" y="300" width="217" height="75" rx="5" fill="#fff" stroke="#c0392b" stroke-width="1.6"/>
<text x="54" y="319" font-size="13" font-weight="600" fill="#111">Power module</text>
<text x="54" y="335" font-size="10.5" fill="#444">V on ADC pin 2, I on pin 3</text>
<text x="54" y="350" font-size="10.5" fill="#444">BATT_MONITOR 4, VOLT_MULT 10.802</text>
<text x="54" y="365" font-size="10.5" fill="#444">AMP_PERVLT 24 (confirmed)</text>
<rect x="40" y="430" width="181" height="60" rx="5" fill="#fff" stroke="#c0392b" stroke-width="1.6"/>
<text x="54" y="449" font-size="13" font-weight="600" fill="#111">Buck A  XY-3606</text>
<text x="54" y="465" font-size="10.5" fill="#444">5.00 V by meter, USB-C out</text>
<text x="54" y="480" font-size="10.5" fill="#444">feeds UNO Q only</text>
<rect x="40" y="545" width="199" height="90" rx="5" fill="#fff" stroke="#c0392b" stroke-width="1.6"/>
<text x="54" y="564" font-size="13" font-weight="600" fill="#111">Buck B  XY-3606</text>
<text x="54" y="580" font-size="10.5" fill="#444">5.00 V by meter, USB-A out</text>
<text x="54" y="595" font-size="10.5" fill="#444">feeds MG90 + ESP32 rail</text>
<text x="54" y="610" font-size="10.5" fill="#444">separate so a stalled gate</text>
<text x="54" y="625" font-size="10.5" fill="#444">cannot brown out the computer</text>
<rect x="470" y="150" width="317" height="240" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="484" y="169" font-size="13" font-weight="600" fill="#111">Pixhawk 2.4.8</text>
<text x="484" y="185" font-size="10.5" fill="#444">ArduCopter 4.7.0, Pixhawk1-bdshot</text>
<text x="484" y="200" font-size="10.5" fill="#444">FRAME_CLASS 2 (hexa), FRAME_TYPE 1 (X)</text>
<text x="484" y="215" font-size="10.5" fill="#444"></text>
<text x="484" y="230" font-size="10.5" fill="#444">POWER    &lt;- power module, 6-pin</text>
<text x="484" y="245" font-size="10.5" fill="#444">MAIN 1-6 -&gt; ESC signal, plain PWM</text>
<text x="484" y="260" font-size="10.5" fill="#444">AUX1     -&gt; ch9 servo, SERVO9_FUNCTION 0</text>
<text x="484" y="275" font-size="10.5" fill="#444">TELEM1   &lt;-&gt; ESP32, SERIAL1_PROTOCOL 2, 115200</text>
<text x="484" y="290" font-size="10.5" fill="#444">TELEM2   &lt;-&gt; SiK radio, SERIAL2_PROTOCOL 2, 57600</text>
<text x="484" y="305" font-size="10.5" fill="#444">GPS      &lt;-  NEO-M8N, SERIAL3</text>
<text x="484" y="320" font-size="10.5" fill="#444">I2C      &lt;-&gt; compass + OLED splitter</text>
<text x="484" y="335" font-size="10.5" fill="#444">SERIAL4  &lt;-  TF-Luna, PROTOCOL 9, 115200</text>
<text x="484" y="350" font-size="10.5" fill="#444">RCIN     &lt;-  FS-iA10B, iBUS</text>
<text x="484" y="365" font-size="10.5" fill="#444">USB      &lt;-&gt; UNO Q, MAVLink2</text>
<text x="484" y="380" font-size="10.5" fill="#444">BUZZER / SAFETY SWITCH</text>
<rect x="1090" y="90" width="211" height="60" rx="5" fill="#fff" stroke="#c0392b" stroke-width="1.6"/>
<text x="1104" y="109" font-size="13" font-weight="600" fill="#111">6x 45A BLHeli_32 ESC</text>
<text x="1104" y="125" font-size="10.5" fill="#444">signal from MAIN 1-6, plain PWM</text>
<text x="1104" y="140" font-size="10.5" fill="#444">power from the XT60 harness</text>
<rect x="1090" y="175" width="270" height="60" rx="5" fill="#fff" stroke="#c0392b" stroke-width="1.6"/>
<text x="1104" y="194" font-size="13" font-weight="600" fill="#111">6x DJI A2212 920KV + 1045</text>
<text x="1104" y="210" font-size="10.5" fill="#444">out1 +90 CW, out2 -90 CCW, out3 -30 CW</text>
<text x="1104" y="225" font-size="10.5" fill="#444">out4 +150 CCW, out5 +30 CCW, out6 -150 CW</text>
<rect x="1090" y="275" width="282" height="75" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="294" font-size="13" font-weight="600" fill="#111">MG90 metal-gear servo</text>
<text x="1104" y="310" font-size="10.5" fill="#444">signal AUX1 ch9, 500 us shut / 1600 us open</text>
<text x="1104" y="325" font-size="10.5" fill="#444">SERVO9_MIN 500, MAX 1800, TRIM 500</text>
<text x="1104" y="340" font-size="10.5" fill="#444">V+ from Buck B, ground common</text>
<rect x="1090" y="365" width="181" height="45" rx="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="1104" y="384" font-size="13" font-weight="600" fill="#111">Hopper + gate</text>
<text x="1104" y="400" font-size="10.5" fill="#444">demo payload: mustard seed</text>
<rect x="1090" y="440" width="264" height="75" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="459" font-size="13" font-weight="600" fill="#111">ESP32-WROOM-32</text>
<text x="1104" y="475" font-size="10.5" fill="#444">MAVLink2 compid 195 at 10 Hz</text>
<text x="1104" y="490" font-size="10.5" fill="#444">GPIO17 TX2 -&gt; FC RX, GPIO16 RX2 &lt;- FC TX</text>
<text x="1104" y="505" font-size="10.5" fill="#444">GND common with the FC</text>
<rect x="1090" y="545" width="229" height="45" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="564" font-size="13" font-weight="600" fill="#111">TCA9548A I2C mux</text>
<text x="1104" y="580" font-size="10.5" fill="#444">addr 0x70, SDA GPIO21 / SCL GPIO22</text>
<rect x="1090" y="615" width="229" height="90" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="634" font-size="13" font-weight="600" fill="#111">6x VL53L0X, 0x29 each</text>
<text x="1104" y="650" font-size="10.5" fill="#444">mux ch0-5, one per 60 deg sector</text>
<text x="1104" y="665" font-size="10.5" fill="#444">4 of 6 fitted and live</text>
<text x="1104" y="680" font-size="10.5" fill="#444">SECTOR_NO_DATA 65535</text>
<text x="1104" y="695" font-size="10.5" fill="#444">bearing = offset + 60*s, clockwise</text>
<rect x="1090" y="730" width="240" height="60" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="749" font-size="13" font-weight="600" fill="#111">Benewake TF-Luna</text>
<text x="1104" y="765" font-size="10.5" fill="#444">SERIAL4, 115200, RNGFND1_TYPE 20</text>
<text x="1104" y="780" font-size="10.5" fill="#444">RNGFND1_ORIENT 25 (down), 0.2 to 8 m</text>
<rect x="1090" y="810" width="152" height="45" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="829" font-size="13" font-weight="600" fill="#111">NEO-M8N + compass</text>
<text x="1104" y="845" font-size="10.5" fill="#444">on the mast, SERIAL3</text>
<rect x="1090" y="870" width="205" height="45" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="889" font-size="13" font-weight="600" fill="#111">I2C splitter</text>
<text x="1104" y="905" font-size="10.5" fill="#444">external compass + SH1106 OLED</text>
<rect x="1090" y="935" width="217" height="45" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="954" font-size="13" font-weight="600" fill="#111">FlySky FS-iA10B</text>
<text x="1104" y="970" font-size="10.5" fill="#444">iBUS from the FS-i6X transmitter</text>
<rect x="1090" y="995" width="240" height="45" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="1104" y="1014" font-size="13" font-weight="600" fill="#111">SiK 433 MHz radio</text>
<text x="1104" y="1030" font-size="10.5" fill="#444">TELEM2, 57600, to the ground station</text>
<rect x="470" y="700" width="282" height="105" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="484" y="719" font-size="13" font-weight="600" fill="#111">Arduino UNO Q (4 GB)</text>
<text x="484" y="735" font-size="10.5" fill="#444">Qualcomm QRB2210, Debian Linux, + STM32U585</text>
<text x="484" y="750" font-size="10.5" fill="#444">yolo26n ONNX on CPU, 489 ms/frame</text>
<text x="484" y="765" font-size="10.5" fill="#444">mission state machine, MAVLink compid 191</text>
<text x="484" y="780" font-size="10.5" fill="#444">after landing: Flask base station on :8080</text>
<text x="484" y="795" font-size="10.5" fill="#444">powered from Buck A, USB-C</text>
<rect x="470" y="900" width="176" height="60" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="484" y="919" font-size="13" font-weight="600" fill="#111">Logitech B525 webcam</text>
<text x="484" y="935" font-size="10.5" fill="#444">USB, 1280x720 MJPG, nadir</text>
<text x="484" y="950" font-size="10.5" fill="#444">HFOV 56.2 deg measured</text>
<rect x="470" y="985" width="193" height="45" rx="5" fill="#fff" stroke="#1f6feb" stroke-width="1.6"/>
<text x="484" y="1004" font-size="13" font-weight="600" fill="#111">Anker 4-port USB-A hub</text>
<text x="484" y="1020" font-size="10.5" fill="#444">UNO Q &lt;-&gt; Pixhawk and camera</text>
<text x="40" y="1156" font-size="10.5" fill="#666">All grounds common. SERIAL5 (D0/D1) retired, SERIAL5_PROTOCOL -1. RNGFND2 (upward) disabled, ch6 dead 2026-08-21.</text>
</svg>