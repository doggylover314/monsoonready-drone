<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" font-family="Helvetica, Arial, sans-serif">
<style>
  .box{fill:#fff;stroke:#222;stroke-width:2;rx:6}
  .fc{fill:#e8f0fe;stroke:#1a56b0;stroke-width:3}
  .ai{fill:#e9f7ec;stroke:#1e7a3c;stroke-width:3}
  .pwr{fill:#fdecea;stroke:#b3261e;stroke-width:2}
  .sens{fill:#fff8e1;stroke:#946200;stroke-width:2}
  .act{fill:#f3e8fd;stroke:#6b21a8;stroke-width:2}
  .blocked{fill:#fff;stroke:#b3261e;stroke-width:2;stroke-dasharray:7 5}
  .t{font-size:15px;fill:#111}
  .tb{font-size:17px;font-weight:bold;fill:#111}
  .ts{font-size:12px;fill:#444}
  .pin{font-size:12px;fill:#1a56b0;font-weight:bold}
  .pinp{font-size:12px;fill:#b3261e;font-weight:bold}
  .wire{stroke:#1a56b0;stroke-width:2;fill:none;marker-end:url(#a)}
  .wire2{stroke:#1a56b0;stroke-width:2;fill:none;marker-end:url(#a);marker-start:url(#a2)}
  .pw{stroke:#b3261e;stroke-width:3;fill:none;marker-end:url(#ap)}
  .bw{stroke:#b3261e;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#ap)}
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a56b0"/></marker>
  <marker id="a2" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#1a56b0"/></marker>
  <marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3261e"/></marker>
</defs>

<text x="30" y="34" class="tb" font-size="22">MonsoonReady - System Block Diagram</text>
<text x="30" y="56" class="ts">F550 hexacopter. Blue = data/MAVLink. Red = power. Dashed red outline = link not yet resolved.</text>

<!-- POWER COLUMN -->
<rect x="30" y="90" width="190" height="60" class="box pwr"/>
<text x="42" y="115" class="tb">3S 8000mAh LiPo</text><text x="42" y="136" class="ts">XT60, ~60A cont.</text>

<rect x="30" y="190" width="190" height="56" class="box pwr"/>
<text x="42" y="214" class="tb">Power Module</text><text x="42" y="234" class="ts">V/I sense to FC</text>

<rect x="30" y="286" width="190" height="56" class="box pwr"/>
<text x="42" y="310" class="tb">Buck (USB-C out)</text><text x="42" y="330" class="ts">fixed 5V, 5.20V loaded</text>

<rect x="30" y="382" width="190" height="56" class="box pwr"/>
<text x="42" y="406" class="tb">Buck (USB-A out)</text><text x="42" y="426" class="ts">5V: servo + ESP32</text>

<path d="M125,150 L125,190" class="pw"/>
<path d="M125,150 L125,168 L20,168 L20,314 L30,314" class="pw"/>
<path d="M20,314 L20,410 L30,410" class="pw"/>

<!-- FLIGHT CONTROLLER -->
<rect x="470" y="150" width="290" height="470" class="box fc"/>
<text x="500" y="182" class="tb" font-size="19">Pixhawk 2.4.8</text>
<text x="500" y="203" class="ts">ArduCopter 4.7.0 (Pixhawk1-bdshot)</text>
<text x="500" y="221" class="ts">hexa X, FRAME_CLASS 2 / TYPE 1</text>
<line x1="470" y1="234" x2="760" y2="234" stroke="#1a56b0" stroke-width="1"/>
<text x="486" y="258" class="pinp">POWER</text>
<text x="486" y="284" class="pin">TELEM1</text>
<text x="486" y="310" class="pin">TELEM2</text>
<text x="486" y="336" class="pin">GPS</text>
<text x="486" y="362" class="pin">I2C</text>
<text x="486" y="388" class="pin">SERIAL4</text>
<text x="486" y="414" class="pin">SERIAL5</text>
<text x="486" y="440" class="pin">RCIN</text>
<text x="486" y="466" class="pin">MAIN 1-6</text>
<text x="486" y="492" class="pin">AUX1 (ch9)</text>
<text x="486" y="518" class="pin">BUZZER</text>
<text x="486" y="544" class="pin">SWITCH</text>
<text x="486" y="580" class="ts">Runs the aircraft. Accepts guided</text>
<text x="486" y="597" class="ts">commands from the UNO Q as compid 191.</text>

<path d="M220,218 L440,218 L440,252 L470,252" class="pw"/>

<!-- SiK -->
<rect x="850" y="258" width="230" height="50" class="box sens"/>
<text x="862" y="280" class="tb">SiK 433MHz telemetry</text><text x="862" y="299" class="ts">ground link, 57600</text>
<path d="M760,278 L850,278" class="wire2"/>

<!-- ESP32 + ring -->
<rect x="850" y="322" width="230" height="74" class="box sens"/>
<text x="862" y="344" class="tb">ESP32-WROOM-32</text>
<text x="862" y="363" class="ts">MAVLink compid 195, 10Hz</text>
<text x="862" y="380" class="ts">GPIO17-&gt;RX2, GPIO16&lt;-TX2, GND</text>
<path d="M760,304 L805,304 L805,352 L850,352" class="wire2"/>

<rect x="1140" y="322" width="200" height="50" class="box sens"/>
<text x="1152" y="344" class="tb">TCA9548A mux</text><text x="1152" y="363" class="ts">0x70, GPIO21/22 I2C</text>
<path d="M1080,347 L1140,347" class="wire"/>

<rect x="1140" y="392" width="200" height="66" class="box sens"/>
<text x="1152" y="414" class="tb">7x VL53L0X</text>
<text x="1152" y="432" class="ts">ch0-5 ring @60deg</text>
<text x="1152" y="450" class="ts">ch6 upward</text>
<path d="M1240,372 L1240,392" class="wire"/>

<!-- GPS -->
<rect x="850" y="410" width="230" height="50" class="box sens"/>
<text x="862" y="432" class="tb">NEO-M8N GPS</text><text x="862" y="451" class="ts">on mast, w/ compass</text>
<path d="M760,330 L820,330 L820,435 L850,435" class="wire"/>

<!-- I2C -->
<rect x="850" y="474" width="230" height="66" class="box sens"/>
<text x="862" y="496" class="tb">I2C splitter</text>
<text x="862" y="514" class="ts">external compass</text>
<text x="862" y="532" class="ts">+ SH1106 OLED status</text>
<path d="M760,356 L800,356 L800,500 L850,500" class="wire2"/>

<!-- TF-Luna -->
<rect x="850" y="554" width="230" height="56" class="box sens"/>
<text x="862" y="576" class="tb">TF-Luna rangefinder</text>
<text x="862" y="595" class="ts">downward, 0.2-8m, 115200</text>
<path d="M760,382 L785,382 L785,578 L850,578" class="wire2"/>

<!-- RC -->
<rect x="850" y="624" width="230" height="50" class="box sens"/>
<text x="862" y="646" class="tb">FS-iA10B receiver</text><text x="862" y="665" class="ts">iBUS, from FS-i6X TX</text>
<path d="M760,434 L830,434 L830,649 L850,649" class="wire"/>

<!-- ESC / motors -->
<rect x="470" y="670" width="290" height="66" class="box act"/>
<text x="486" y="694" class="tb">6x 45A BLHeli_32 ESC</text>
<text x="486" y="712" class="ts">-&gt; 6x DJI A2212 920KV + 1045 props</text>
<text x="486" y="729" class="ts">plain PWM on MAIN (no DShot)</text>
<path d="M600,620 L600,670" class="wire"/>

<!-- Servo -->
<rect x="180" y="670" width="250" height="66" class="box act"/>
<text x="192" y="694" class="tb">MG90 servo gate</text>
<text x="192" y="712" class="ts">signal from AUX1 (ch9)</text>
<text x="192" y="729" class="ts">power from USB-A buck</text>
<path d="M470,496 L440,496 L440,690 L430,690" class="wire"/>
<path d="M125,438 L125,700 L180,700" class="pw"/>

<rect x="180" y="762" width="250" height="50" class="box act"/>
<text x="192" y="784" class="tb">Hopper + granules</text><text x="192" y="803" class="ts">demo payload: inert salt</text>
<path d="M305,736 L305,762" class="wire"/>

<!-- UNO Q -->
<rect x="150" y="850" width="620" height="120" class="box ai"/>
<text x="170" y="880" class="tb" font-size="19">Arduino UNO Q (4GB)</text>
<text x="170" y="902" class="ts">Qualcomm QRB2210 (Debian Linux) + STM32U585</text>
<text x="170" y="922" class="ts">yolo26n ONNX in onnxruntime, CPU: 489ms/frame (2.05 fps)</text>
<text x="170" y="942" class="ts">Mission state machine, MAVLink compid 191</text>
<text x="170" y="962" class="ts">After landing: Flask base station, heatmap dashboard on :8080</text>

<rect x="820" y="850" width="240" height="56" class="box sens"/>
<text x="832" y="872" class="tb">Logitech B525</text><text x="832" y="891" class="ts">720p MJPG, nadir, focus locked</text>

<rect x="820" y="922" width="240" height="48" class="box pwr"/>
<text x="832" y="944" class="tb">ETZIN splitter</text><text x="832" y="962" class="ts">charge port in, A-port out</text>

<path d="M1060,878 L1090,878 L1090,946 L1060,946" class="wire2"/>
<path d="M820,946 L770,946" class="pw"/>
<path d="M125,438 L125,946 L150,946" class="pw"/>

<!-- BLOCKED link -->
<rect x="180" y="770" width="0" height="0"/>
<path d="M470,408 L300,408 L300,850" class="bw"/>
<rect x="196" y="470" width="256" height="86" class="box blocked"/>
<text x="208" y="494" class="tb" fill="#b3261e">UNO Q &lt;-&gt; Pixhawk link</text>
<text x="208" y="513" class="ts">planned: D0/D1 (STM32 USART1)</text>
<text x="208" y="531" class="ts">to SERIAL5, MAVLink2 115200</text>
<text x="208" y="549" class="ts" fill="#b3261e">UNRESOLVED: Serial1 may be</text>
<text x="208" y="566" class="ts" fill="#b3261e">claimed by the Arduino router</text>
</svg>
